name: Android APK (Ковадло)

# Надійна альтернатива збірці на телефоні (модуль 14): той самий
# Gradle-проєкт (android/), але на звичайній машині GitHub Actions —
# без обмежень пам'яті/сховища телефону. Готовий .apk можна одразу
# скачати з артефактів запуску.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "kovadlo/**"
      - "web/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # symlinks: true — важливо: android/pysrc/{kovadlo,web} це
        # символічні посилання на пакети в корені репозиторію (щоб
        # Chaquopy підключав ядро "як є", без копіювання).
        with:
          fetch-depth: 1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Кеш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Збірка debug-APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kovadlo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
