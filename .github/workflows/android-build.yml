name: Android APK (Ковадло)

# Надійна альтернатива збірці на телефоні (модуль 14): той самий
# Gradle-проєкт (android/), але на звичайній машині GitHub Actions —
# без обмежень пам'яті/сховища телефону. Готовий .apk можна одразу
# скачати з артефактів запуску.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # android/pysrc/{kovadlo,web} — символічні посилання на пакети в
        # корені репозиторію (щоб Chaquopy підключав ядро "як є", без
        # копіювання). Спеціальний прапорець тут не потрібен: на
        # ubuntu-latest git за замовчуванням (core.symlinks=true)
        # відновлює їх як справжні symlink'и.
        with:
          fetch-depth: 1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Python 3.11 (для Chaquopy buildPython)
        # Версія Python на машині збірки має збігатися мажор.мінор з
        # версією в chaquopy.defaultConfig.version ("3.11" в app/build.gradle.kts).
        # Після цього кроку інтерпретатор доступний в PATH як "python3.11" —
        # саме такий фолбек-кандидат прописаний другим у buildPython(...).
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Кеш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Збірка debug-APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kovadlo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
