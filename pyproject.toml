[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kovadlo"
version = "0.1.0"
description = "Ковадло — чисте ядро для параметричного моделювання будівель (кімнати, стіни, профілі), без графіки"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["kovadlo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
