      <div id="heat-layer-list"></div>
      <div class="row2" style="margin-top:6px">
        <select id="heat-material-select">${state.heat.materials.map((m) => `<option value="${m.name}">${m.name} (λ=${m.thermal_conductivity_w_mk.toFixed(3)})</option>`).join("")}</select>
        <input id="heat-thickness" type="number" placeholder="товщина, мм" value="100">
      </div>
      <button class="primary block" id="btn-add-layer" style="margin-top:6px">Додати шар</button>
    </section>
  `);
  panelEl.appendChild(layersSection);
  const layerList = layersSection.querySelector("#heat-layer-list");
  wallData.layers.forEach((layer, idx) => {
    const item = el(`
      <div class="point-item">
        <span class="grow"><div class="name">${layer.material_name}</div><div class="sub">${layer.thickness_mm.toFixed(0)} мм</div></span>
        <button class="icon-btn danger">✕</button>
      </div>
    `);
    item.querySelector("button").addEventListener("click", () => removeHeatLayer(idx));
    layerList.appendChild(item);
  });
  layersSection.querySelector("#btn-add-layer").addEventListener("click", () => {
    const materialName = layersSection.querySelector("#heat-material-select").value;
    const thickness = Number(layersSection.querySelector("#heat-thickness").value);
    addHeatLayer(materialName, thickness);
  });

  if (wallData.has_layers) {
    const resultSection = el(`
      <section>
        <h2>Результат (модуль 8.4)</h2>
        <div class="stat-grid">
          <div class="k">Опір R</div><div class="v">${wallData.r_value_m2k_w.toFixed(3)} м²·К/Вт</div>
          <div class="k">U</div><div class="v">${wallData.u_value_w_m2k.toFixed(3)} Вт/(м²·К)</div>
          <div class="k">Норма WT2021</div><div class="v">≤${data.max_u_wt2021.toFixed(2)}</div>
          <div class="k">Відповідає</div><div class="v">${wallData.meets_wt2021 ? "так" : "ні"}</div>
          <div class="k">Тепловтрати стіни</div><div class="v">${wallData.heat_loss_w.toFixed(0)} Вт</div>
        </div>
        ${
          wallData.condensation_warnings.length
            ? `<p class="muted">⚠ ${wallData.condensation_warnings.join("; ")}</p>`
            : '<p class="muted">Ризик конденсату не виявлено.</p>'
        }
        <pre id="report">${data.report_text}</pre>
        <div class="row2">
          <button class="secondary" id="btn-refresh-heat">Оновити</button>
          <button class="primary" id="btn-export-heat">Експорт .txt</button>
        </div>
        <button class="secondary block" id="btn-reset-heat" style="margin-top:8px">Скинути все утеплення</button>
      </section>
    `);
    panelEl.appendChild(resultSection);
    resultSection.querySelector("#btn-refresh-heat").addEventListener("click", async () => {
      await refreshHeatState(); renderHeatPanel(); redraw();
    });
    resultSection.querySelector("#btn-export-heat").addEventListener("click", exportHeatReport);
    resultSection.querySelector("#btn-reset-heat").addEventListener("click", resetHeat);
  }
}

/* ---------------------------------------------------------------------
 * Панель: пожежна безпека (9.5)
 * ------------------------------------------------------------------- */

const FIRE_DETECTOR_KINDS = [
  { kind: "SMOKE", label: "Димовий" },
  { kind: "HEAT", label: "Тепловий" },
  { kind: "CO", label: "Чадного газу" },
];

function renderFirePanel() {
  if (!state.room) {
    panelEl.appendChild(el(`<section><p class="muted">Спочатку намалюйте кімнату на вкладці «Вид зверху».</p></section>`));
    return;
  }
  const data = state.fire.data;

  const settingsSection = el(`
    <section>
      <h2>Тип датчика</h2>
      <div class="field">
        <select id="fire-kind">${FIRE_DETECTOR_KINDS.map((k) => `<option value="${k.kind}">${k.label}</option>`).join("")}</select>
      </div>
      <button class="primary block" id="btn-auto-place" style="margin-top:6px">Розставити автоматично</button>
      <p class="muted">Площа покриття/відстань — орієнтовно, за нормами модуля 8.5.</p>
    </section>
  `);
  panelEl.appendChild(settingsSection);
  settingsSection.querySelector("#fire-kind").value = data ? data.detector_kind : "SMOKE";
  settingsSection.querySelector("#fire-kind").addEventListener("change", (e) => setFireDetectorKind(e.target.value));
  settingsSection.querySelector("#btn-auto-place").addEventListener("click", autoPlaceDetectors);

  if (!data) {
    refreshFireState().then(() => { renderFirePanel(); redraw(); });
    return;
  }

  if (data.detectors.length > 0) {
    const listSection = el(`<section><h2>Датчики (${data.detectors.length})</h2><div id="fire-list"></div></section>`);
    panelEl.appendChild(listSection);
    const list = listSection.querySelector("#fire-list");
    data.detectors.forEach((d) => {
      list.appendChild(el(`<div class="point-item"><span class="grow">${d.name}</span></div>`));
    });
  }

  const resultSection = el(`
    <section>
      <h2>Результат (модуль 8.5)</h2>
      <div class="stat-grid">
        <div class="k">Кількість датчиків</div><div class="v">${data.detectors.length}</div>
        <div class="k">Радіус покриття</div><div class="v">~${data.coverage_radius_m.toFixed(1)} м</div>
        <div class="k">Довжина шлейфу</div><div class="v">${data.loop_length_m != null ? data.loop_length_m.toFixed(2) + " м" : "—"}</div>
      </div>
      ${data.loop_length_m == null ? '<p class="muted">Поставте щиток на вкладці «Електрика», щоб порахувати шлейф.</p>' : ""}
      <pre id="report">${data.report_text}</pre>
      <div class="row2">
        <button class="secondary" id="btn-refresh-fire">Оновити</button>
        <button class="primary" id="btn-export-fire">Експорт .txt</button>
      </div>
      <button class="secondary block" id="btn-reset-fire" style="margin-top:8px">Скинути датчики</button>
    </section>
  `);
  panelEl.appendChild(resultSection);
  resultSection.querySelector("#btn-refresh-fire").addEventListener("click", async () => {
    await refreshFireState(); renderFirePanel(); redraw();
  });
  resultSection.querySelector("#btn-export-fire").addEventListener("click", exportFireReport);
  resultSection.querySelector("#btn-reset-fire").addEventListener("click", resetFire);
}

/* ---------------------------------------------------------------------
 * Панель: 3D-перегляд (модуль 11)
 * ------------------------------------------------------------------- */

function renderScene3DPanel() {
  if (!state.room) {
    panelEl.appendChild(el(`<section><p class="muted">Спочатку намалюйте кімнату на вкладці «Вид зверху».</p></section>`));
    return;
  }

  const s3 = state.scene3d;

  const roofSection = el(`
    <section>
      <h2>Дах</h2>
      <div class="field">
        <select id="roof-type">
          <option value="NONE">без даху</option>
          <option value="SHED">односхилий</option>
          <option value="GABLE">двосхилий</option>
        </select>
      </div>
      <div class="row2">
        <div class="field"><label>Кут нахилу, °</label><input id="roof-slope" type="number" value="${s3.roofSlope}"></div>
        <div class="field"><label>Сторона/вісь</label><select id="roof-side"></select></div>
      </div>
    </section>
  `);
  panelEl.appendChild(roofSection);
  const roofTypeSelect = roofSection.querySelector("#roof-type");
  roofTypeSelect.value = s3.roofType;
  const sideSelect = roofSection.querySelector("#roof-side");
  function fillRoofSideOptions() {
    sideSelect.innerHTML =
      roofTypeSelect.value === "SHED"
        ? ["south", "north", "west", "east"].map((v) => `<option value="${v}">${v}</option>`).join("")
        : ["x", "z"].map((v) => `<option value="${v}">вздовж ${v}</option>`).join("");
  }
  fillRoofSideOptions();
  roofTypeSelect.addEventListener("change", () => {
    fillRoofSideOptions();
    const patch = { roof_type: roofTypeSelect.value };
    if (roofTypeSelect.value === "SHED") patch.low_side = sideSelect.value;
    if (roofTypeSelect.value === "GABLE") patch.ridge_along = sideSelect.value;
    setRoofSettings(patch);
  });
  roofSection.querySelector("#roof-slope").addEventListener("change", (e) =>
    setRoofSettings({ slope_deg: Number(e.target.value) })
  );
  sideSelect.addEventListener("change", () => {
    const patch = roofTypeSelect.value === "SHED" ? { low_side: sideSelect.value } : { ridge_along: sideSelect.value };
    setRoofSettings(patch);
  });

  const visSection = el(`
    <section>
      <h2>Показ</h2>
      <div class="row2">
        <button class="secondary" id="btn-toggle-roof">${s3.showRoof ? "Сховати дах" : "Показати дах"}</button>
        <button class="secondary" id="btn-toggle-walls">${s3.showWalls ? "Сховати стіни" : "Показати стіни"}</button>
      </div>
      <p class="muted">Швидкі види — кнопки над сценою («Зверху», «Спереду», «Ізометрія»).</p>
    </section>
  `);
  panelEl.appendChild(visSection);
  visSection.querySelector("#btn-toggle-roof").addEventListener("click", toggleRoofVisible);
  visSection.querySelector("#btn-toggle-walls").addEventListener("click", toggleWallsVisible);

  const wallOptions = state.room.walls
    .map((w, i) => `<option value="${i}">Стіна ${i + 1} (${Math.round(w.length_mm)} мм)</option>`)
    .join("");
  const openingSection = el(`
    <section>
      <h2>Вікна й двері</h2>
      <div class="field"><label>Стіна</label><select id="opening-wall">${wallOptions}</select></div>
      <div class="row2">
        <div class="field"><label>Тип</label>
          <select id="opening-kind"><option value="WINDOW">вікно</option><option value="DOOR">двері</option></select>
        </div>
        <div class="field"><label>Відступ, мм</label><input id="opening-offset" type="number" value="500"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Підвіконня, мм</label><input id="opening-sill" type="number" value="900"></div>
        <div class="field"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Ширина, мм</label><input id="opening-width" type="number" value="1200"></div>
        <div class="field"><label>Висота, мм</label><input id="opening-height" type="number" value="1400"></div>
      </div>
      <button class="primary block" id="btn-add-opening">Додати</button>
      <div id="opening-list" style="margin-top:8px"></div>
    </section>
  `);
  panelEl.appendChild(openingSection);

  const kindSelectEl = openingSection.querySelector("#opening-kind");
  const sillInput = openingSection.querySelector("#opening-sill");
  kindSelectEl.addEventListener("change", () => {
    sillInput.value = kindSelectEl.value === "DOOR" ? 0 : 900;
  });

  openingSection.querySelector("#btn-add-opening").addEventListener("click", () => {
    addOpening3D(
      kindSelectEl.value,
      Number(openingSection.querySelector("#opening-wall").value),
      Number(openingSection.querySelector("#opening-offset").value),
      Number(sillInput.value),
      Number(openingSection.querySelector("#opening-width").value),
      Number(openingSection.querySelector("#opening-height").value)
    );
  });

  const openingList = openingSection.querySelector("#opening-list");
  if (s3.data) {
    s3.data.room.walls.forEach((w) => {
      w.openings.forEach((o) => {
        const item = el(`
          <div class="point-item">
            <span class="grow"><div class="name">${o.name}</div><div class="sub">стіна ${w.index + 1}, ${o.width_mm.toFixed(0)}×${o.height_mm.toFixed(0)} мм</div></span>
            <button class="icon-btn danger">✕</button>
          </div>
        `);
        item.querySelector("button").addEventListener("click", () => deleteOpening3D(o.name));
        openingList.appendChild(item);
      });
    });
  }

  panelEl.appendChild(el(`
    <section>
      <h2>Плитка на сцені</h2>
      <p class="muted">${
        state.tiling
          ? "Патерн плитки з вкладки «Розгортка/плитка» накладається на відповідну поверхню як текстура — реальний розмір і колір фуги."
          : "Порахуйте плитку на вкладці «Розгортка/плитка» — тоді її патерн з'явиться і тут."
      }</p>
    </section>
  `));

  const triCount = scene3d && scene3d.renderer ? scene3d.renderer.info.render.triangles : 0;
  panelEl.appendChild(el(`
    <section>
      <h2>Продуктивність</h2>
      <div class="stat-grid">
        <div class="k">Трикутників у кадрі</div><div class="v">${triCount}</div>
      </div>
      <p class="muted">Плитка малюється текстурою-патерном, а не окремими об'єктами.</p>
    </section>
  `));
}

/* ---------------------------------------------------------------------
 * Модуль 14: файл проєкту (Android-застосунок або десктопний браузер)
 *
 * Серверна частина стану (кімната, проводка, освітлення/вентиляція/
 * тепло/пожежна безпека, дах і отвори) береться через /api/project/export
 * і /api/project/import (web/project_io.py) — суворий, повний round-trip.
 *
 * Плитка (модуль 2) на сервері не зберігається як стан (кожен розрахунок
 * самостійний) — її поля живуть лише в HTML-полях вкладки «Розгортка/
 * плитка», тож зберігаються/відновлюються окремо, найкраще зусилля:
 * якщо вкладка не відкрита в момент збереження, поля просто лишать
 * типові значення за замовчуванням при наступному відкритті — не
 * критична втрата (кілька цифр, а не структура кімнати).
 * ------------------------------------------------------------------- */

const TILING_FIELD_IDS = [
  "tile-width", "tile-height", "tile-name", "tile-color",
  "grout-width", "grout-color", "row-offset", "angle",
  "tiles-per-package", "waste-percent",
];

function collectTilingSettings() {
  const settings = {};
  for (const id of TILING_FIELD_IDS) {
    const el = document.getElementById(id);
    if (el) settings[id] = el.value;
  }
  return settings;
}

function applyTilingSettings(settings) {
  if (!settings) return;
  for (const [id, value] of Object.entries(settings)) {
    const el = document.getElementById(id);
    if (el) el.value = value;
  }
}

function applyPendingTilingRestore() {
  const raw = sessionStorage.getItem("kovadlo_pending_tiling_settings");
  if (!raw) return;
  try { applyTilingSettings(JSON.parse(raw)); } catch (e) { /* пошкоджені дані — просто ігноруємо */ }
  sessionStorage.removeItem("kovadlo_pending_tiling_settings");
}

async function buildProjectFileJson() {
  const server = await apiGet("/api/project/export");
  return JSON.stringify(
    { format: "kovadlo-project-full", version: 1, server, client: { tiling_settings: collectTilingSettings() } },
    null, 2
  );
}

async function applyProjectFileJson(jsonText) {
  const data = JSON.parse(jsonText);
  if (data.format !== "kovadlo-project-full") throw new Error("Не файл проєкту Ковадла (невідомий формат)");
  await apiPost("/api/project/import", data.server);
  if (data.client && data.client.tiling_settings) {
    sessionStorage.setItem("kovadlo_pending_tiling_settings", JSON.stringify(data.client.tiling_settings));
  }
  // Повне перезавантаження сторінки — найнадійніший спосіб гарантовано
  // підхопити щойно імпортований стан сервера в усіх вкладках одразу,
  // без ризику пропустити якийсь закешований на клієнті шматок стану.
  location.reload();
}

async function saveProjectToFile() {
  try {
    const json = await buildProjectFileJson();
    if (window.KovadloNative && window.KovadloNative.saveProject) {
      // Android: збереження через Storage Access Framework (ProjectFileBridge.kt).
      window.KovadloNative.saveProject(json, "kovadlo-project.json");
    } else {
      // Десктопний браузер — те саме завантаження Blob, що й для звітів.
      const blob = new Blob([json], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "kovadlo-project.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
  } catch (e) {
    alert("Не вдалося зберегти проєкт: " + e.message);
  }
}

function openProjectFromFile() {
  if (window.KovadloNative && window.KovadloNative.openProject) {
    window.KovadloNative.openProject();
  } else {
    document.getElementById("project-file-input").click();
  }
}

document.getElementById("project-file-input").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => applyProjectFileJson(reader.result).catch(err => alert("Не вдалося відкрити проєкт: " + err.message));
  reader.readAsText(file);
  e.target.value = "";
});

// Виклики з Kotlin (ProjectFileBridge.kt) після діалогу SAF.
window.onKovadloSaveResult = function (ok, error) {
  if (!ok && error) alert("Не вдалося зберегти проєкт: " + error);
};
window.onKovadloOpenResult = function (ok, jsonText, error) {
  if (!ok) { if (error) alert("Не вдалося відкрити проєкт: " + error); return; }
  applyProjectFileJson(jsonText).catch(err => alert("Не вдалося відкрити проєкт: " + err.message));
};

/* ---------------------------------------------------------------------
 * Старт
 * ------------------------------------------------------------------- */

async function init() {
  renderPanel();
  updateHint();
  resizeCanvas();
  try {
    const room = await apiGet("/api/room");
    state.room = room;
    fitView(state.viewTop, room.contour.map(([x,z]) => ({x,z})));
  } catch (e) {
    // кімнати ще немає — це нормальний стан на старті
  }
  await refreshElectricalState();
  await refreshElectricalReport();
  renderPanel();
  updateHint();
  redraw();
}
init();

// PWA: реєстрація service worker (кешування оболонки для офлайн-
// завантаження й встановлення на головний екран). Не критично для
// роботи сторінки — якщо реєстрація не вдалась (напр. відкрито по
// http:// не з localhost), просто мовчки пропускаємо.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
